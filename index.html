<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEMORY LOG</title>

<style>

body{
    margin:0;
    background:#050505;
    color:#6dff6d;
    font-family:Consolas, monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    width:430px;
    border:1px solid #6dff6d;
    padding:30px;
    box-shadow:0 0 20px rgba(0,255,0,.15);
}

h1{
    text-align:center;
    letter-spacing:5px;
    margin-bottom:25px;
}

.info{
    margin-bottom:18px;
    line-height:1.5;
    color:#9aff9a;
}

.label{
    color:#6dff6d;
    font-weight:bold;
}

input{
    width:100%;
    box-sizing:border-box;
    background:black;
    color:#6dff6d;
    border:1px solid #6dff6d;
    padding:12px;
    margin-top:15px;
    font-size:15px;
    font-family:Consolas, monospace;
}

button{
    width:100%;
    margin-top:15px;
    padding:12px;
    background:#111;
    color:#6dff6d;
    border:1px solid #6dff6d;
    cursor:pointer;
    font-family:Consolas, monospace;
}

button:hover{
    background:#1b1b1b;
}

#message{
    margin-top:20px;
    min-height:40px;
    color:#9aff9a;
    line-height:1.5;
}

</style>
</head>

<body>

<div class="box">

<h1>MEMORY LOG</h1>

<div class="info">
<span class="label">DATABASE STATUS</span><br>
RESTRICTED
</div>

<div class="info">
<span class="label">SUBJECT</span><br>
<del>Lindsay Everhart</del><br>
ARCHIVE
</div>

<div class="info">
<span class="label">FILE STATUS</span><br>
SEALED
</div>

<div class="info">
<span class="label">CLEARANCE LEVEL</span><br>
Authorization Required
</div>

<input
id="password"
type="password"
placeholder="Enter Authorization Code">

<button onclick="checkPassword()">
VERIFY
</button>

<div id="message"></div>

</div>

<script>

function checkPassword(){

const code = "SAY-GEX";

const input = document.getElementById("password").value.trim();

const message = document.getElementById("message");

if(input === code){

message.innerHTML =
"ACCESS GRANTED.<br><br>Decrypting memory log...<br>Please wait.";

setTimeout(function(){

window.location.href="https://drive.google.com/drive/folders/1p7pM3kf28HTcWOcj_y5vOB-0Ku64THOu";

},2200);

}else{

message.innerHTML =
"ACCESS DENIED.<br>Invalid authorization code.";

}

}

</script>

</body>
</html>
